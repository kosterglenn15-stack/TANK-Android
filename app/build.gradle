plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tank.companion'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tank.companion'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("TANK_KEYSTORE_PATH"))
            storePassword System.getenv("TANK_KEYSTORE_PASSWORD")
            keyAlias System.getenv("TANK_KEY_ALIAS")
            keyPassword System.getenv("TANK_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }

        debug {
            minifyEnabled false
        }
    }
}
