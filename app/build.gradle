
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tank.companion'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tank.companion'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1-test'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.test'
            versionNameSuffix '-debug'
        }

        release {
            minifyEnabled false
        }
    }
}
