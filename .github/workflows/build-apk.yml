name: Build Signed Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      TANK_KEYSTORE_PATH: ${{ github.workspace }}/tank-release.jks
      TANK_KEYSTORE_PASSWORD: ${{ secrets.TANK_KEYSTORE_PASSWORD }}
      TANK_KEY_PASSWORD: ${{ secrets.TANK_KEY_PASSWORD }}
      TANK_KEY_ALIAS: ${{ secrets.TANK_KEY_ALIAS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TANK_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$TANK_KEYSTORE_PATH"
          test -s "$TANK_KEYSTORE_PATH" || { echo "Keystore restore failed"; exit 1; }

      - name: Verify signing key
        shell: bash
        run: |
          keytool -list \
            -keystore "$TANK_KEYSTORE_PATH" \
            -storepass "$TANK_KEYSTORE_PASSWORD" \
            -alias "$TANK_KEY_ALIAS" >/dev/null

      - name: Find Android SDK Manager
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK 35
        shell: bash
        run: |
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: TANK-Companion-v1.2-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
