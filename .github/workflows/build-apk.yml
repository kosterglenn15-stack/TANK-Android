name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        shell: bash
        run: |
          echo "Repository contents:"
          ls -la

          echo "Checking required files..."

          test -f settings.gradle || { echo "ERROR: settings.gradle missing"; exit 1; }
          test -f build.gradle || { echo "ERROR: build.gradle missing"; exit 1; }
          test -f app/build.gradle || { echo "ERROR: app/build.gradle missing"; exit 1; }

          echo "Project files OK"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Java version
        run: java -version

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK 35
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show Gradle version
        run: gradle --version

      - name: Show Gradle projects
        run: gradle projects

      - name: Clean project
        run: gradle clean

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Find generated APK
        shell: bash
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TANK-Android-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
