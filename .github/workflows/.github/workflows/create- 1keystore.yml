name: Create Android Keystore

on:
  workflow_dispatch:

jobs:
  create-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create keystore
        shell: bash
        env:
          STORE_PASS: ${{ secrets.TANK_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.TANK_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TANK_KEY_ALIAS }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore tank-release.jks \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=TANK Companion, OU=TANK, O=TANK, L=Roermond, ST=Limburg, C=NL"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: tank-release-keystore
          path: tank-release.jks
          if-no-files-found: error
